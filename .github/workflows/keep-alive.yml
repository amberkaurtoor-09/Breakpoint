# Ping the Render API every 10 minutes so the free instance does not sleep.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Breakpoint API
        run: >
          curl -fsS --retry 4 --retry-all-errors --retry-delay 15 --max-time 90
          https://breakpoint-dkys.onrender.com/traces
